name: Feedback
description: Tell me what you thought or what seemed broken
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a look! Don't worry about being technical —
        just tell me what you noticed. Anything that looked broken,
        confusing, or off is helpful.

  - type: textarea
    id: what
    attributes:
      label: What did you notice?
      description: Anything that looked wrong, was hard to read, or didn't work.
      placeholder: The menu button didn't do anything when I tapped it on my phone.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: What page were you on?
      placeholder: The Blender page, or just paste the link from your browser

  - type: input
    id: device
    attributes:
      label: Phone or computer?
      placeholder: iPhone / Windows laptop / whatever you were using

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: If something looked weird, a screenshot helps a lot. Just drag it in.